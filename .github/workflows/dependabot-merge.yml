name: Merge tested dependencies
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # The authorized writer merges, which starts the main pipeline itself.
      - uses: actions/create-github-app-token@v3
        id: writer
        with:
          app-id: ${{ secrets.RELEASE_WRITER_APP_ID }}
          private-key: ${{ secrets.RELEASE_WRITER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/merge-tested-dependabot@6ffed9570a616d63bc93d637c1fd20887a191371
        with:
          token: ${{ steps.writer.outputs.token }}

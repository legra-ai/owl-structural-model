[package]
name = "owl-structural-model"
version = "0.1.4"
description = "Typed OWL 2 structural values for Rust"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/legra-ai/owl-structural-model"
documentation = "https://docs.rs/owl-structural-model"
readme = "README.md"
keywords = ["owl", "owl2", "ontology", "rdf", "semantic-web"]
categories = ["data-structures", "encoding"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**/*.rs",
    "tests/**/*.rs",
]

[lib]
doctest = true

[dependencies]
iri-rfc3987 = "=0.1.6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde_json = "1"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
